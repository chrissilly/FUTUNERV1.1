# Bench CAN Toolkit — toolkit-wide defaults.
#
# These are NON-BINDING proposed defaults. Sean must approve any change
# that touches the bus (BITRATE, IFACE, request/response IDs) before it
# becomes part of the validated bench setup. This file follows the
# project's "no magic numbers" rule (FUTV1.1/CLAUDE.md hard rule 3).
#
# Format: KEY=VALUE, one per line. Sourced by the bench shell scripts
# and read directly by parse_uds.py. Anything not understood is ignored.

# SocketCAN interface name (Linux). On macOS, python-can talks to the
# Candlelight directly via libusb (gs_usb backend); the value is then
# informational only.
DEFAULT_IFACE=can0

# CAN bus bitrate. The dongle is hardcoded to 500 kbps per BOARD_REV2
# (firmware/src/can/can_driver.c). Changing this here without
# changing the dongle will produce nothing but bus errors.
DEFAULT_BITRATE=500000

# Maximum capture duration in seconds. capture_start.sh enforces this
# so a forgotten capture cannot grow without bound. Increase only with
# Sean's approval and confirmation that the disk has room.
DEFAULT_MAX_SECONDS=120

# Default capture name when --name is not given.
DEFAULT_CAPTURE_NAME=untitled

# UDS request/response ID pair for the dongle's diagnostic channel.
# The dongle uses 0x7E0 as the tester address; the C8 J533 gateway
# routes ECU responses back at 0x710 (NOT the standard ISO 14229 0x7E8).
# Per FUTV1.1/CLAUDE.md hard rule 1, only this pair is allowed. Adding
# a different pair here is a project-wide protocol change, not a
# toolkit tweak.
TESTER_REQUEST_ID=0x7E0
ECU_RESPONSE_ID=0x710
